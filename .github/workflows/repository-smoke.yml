name: Repository smoke checks

on:
  push:
    branches:
      - phase-0-1-safe-research-foundation
      - dev-seo-audit-v2
  pull_request:
    branches:
      - main
      - feature/phase-1-arbeitnow-integration

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository and AI diagnostics tests
        run: node --test tests/repository-smoke.test.mjs tests/seo-audit-v2.test.mjs tests/ai-diagnostics.test.mjs tests/agent-run.test.mjs tests/gemini-key-pool.test.mjs tests/ai-failover.test.mjs tests/agent-policy.test.mjs tests/agent-skill-registry.test.mjs
